# The overview on GitHub Pages and the README picture. Rebuild the picture: node ../plugins/diagram-kit/skills/create-diagram/scripts/diagram.mjs build how-it-works.yaml --dark --no-html
# One column, read top to bottom; both checks send the diagram back to be reshaped when something looks incorrect.
kind: architecture
title: diagram-kit
subtitle: How it works
direction: down
layout: { elk.layered.spacing.nodeNodeBetweenLayers: 40, sameSize: [[cmd, shape, lint, look, out], [elk, mind, seq]] }
groups:
  - {id: kit, label: diagram-kit, about: "The create-diagram skill and its scripts: what your agent does (violet) and what plain code does (blue)."}
  - {id: engine, label: Layout Engine calculations, icon: sigma, tone: blue, parent: kit, about: "Code computes the geometry, with the engine that fits the kind of diagram. Agents are bad at placing boxes, so code does it."}
nodes:
  - {id: cmd, label: /create-diagram, sub: in Claude Code or Codex, icon: square-terminal, about: "Ask Claude Code or Codex for a diagram of a system, a flow or a document, and say where it should go."}
  - {id: shape, label: Shape an initial diagram, icon: pencil-line, group: kit, tone: violet, about: "Following the skill, your agent decides what the diagram says: the parts, groups and flows, in reading order. No coordinates."}
  - {id: elk, label: ELK.js, link: "https://github.com/kieler/elkjs", group: engine, about: "Architecture, flowcharts, state machines, data models and trees: ELK.js places every part and routes every wire, several ways at once."}
  - {id: mind, label: Mind maps, sub: diagram-kit algorithm, group: engine, about: "Our own layout: the root in the middle, branches split left and right by size, each side a tidy tree."}
  - {id: seq, label: Sequences, sub: diagram-kit algorithm, group: engine, about: "Our own deterministic layout: columns spaced so every message label fits, rows in message order, blocks around their rows."}
  - {id: lint, label: Programmatic layout checks, sub: "overlaps? lines crossing?", icon: list-checks, group: kit, tone: blue, about: "Code measures each layout: overlaps, crossings, wires running backwards, labels that do not fit."}
  - {id: look, label: Agentic visual checks, icon: eye, group: kit, tone: violet, about: "Your agent looks at the rendered picture like a designer: does it read well and get the message across?"}
  - {id: out, label: Implement to any medium, icon: star, tone: amber, about: "The checked layout is the reference. Your agent rebuilds it in your medium and style: a page, an app, a doc, anything."}
edges:
  - {from: cmd, to: shape, main: true}
  - {from: shape, to: engine, main: true}
  - {from: engine, to: lint, main: true}
  - {from: lint, to: look, main: true}
  - {from: look, to: out, main: true}
  - {from: look, to: shape, label: looks incorrect, kind: return, back: true}
  - {from: lint, to: shape, kind: return, back: true}
